name: Offline research checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest --cov=volatility_research --cov-report=term-missing
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen volatility-research demo --output reports/ci-synthetic-demo
      - run: uv run --frozen python -m volatility_research.extension --demo --output reports/ci-higher-order-demo
